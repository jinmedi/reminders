<title>미리알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --side:#F2F2F7; --tile:#FFFFFF;
  --text:#000000; --text2:#8A8A8E; --text3:#C4C4C7;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12);
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --allc:#5B5B61;
  --sel:rgba(0,122,255,.12); --overlay:rgba(0,0,0,.28);
  --shadow:0 18px 50px rgba(0,0,0,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --side:#161618; --tile:#2C2C2E;
    --text:#FFFFFF; --text2:#8D8D93; --text3:#545458;
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.26);
    --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --allc:#98989F;
    --sel:rgba(10,132,255,.24); --overlay:rgba(0,0,0,.55);
    --shadow:0 18px 50px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --side:#161618; --tile:#2C2C2E;
  --text:#FFFFFF; --text2:#8D8D93; --text3:#545458;
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.26);
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --allc:#98989F;
  --sel:rgba(10,132,255,.24); --overlay:rgba(0,0,0,.55);
  --shadow:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--surface);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}

.app{display:grid;grid-template-columns:minmax(260px,300px) 1fr;height:100%}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--sep);overflow-y:auto;display:flex;flex-direction:column;padding:14px 14px 0}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:36px;color:var(--text2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;font-size:15px;color:var(--text)}
.search input::placeholder{color:var(--text2)}
.search input::-webkit-search-cancel-button{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 24px}
.tile{background:var(--tile);border-radius:12px;padding:9px 11px 9px 9px;text-align:left;display:grid;grid-template-columns:auto 1fr;row-gap:8px;align-items:center;transition:background-color .15s}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.tile .n{justify-self:end;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .lbl{grid-column:1/-1;font-weight:600;color:var(--text2);font-size:15px}
.tile.on{background:var(--c)}
.tile.on .n,.tile.on .lbl{color:#fff}
.tile.on .ic{background:#fff;color:var(--c)}
.side-h{font-size:20px;font-weight:700;margin:0 4px 8px;letter-spacing:-.01em}
.lists{list-style:none;margin:0;padding:0;background:var(--tile);border-radius:12px;overflow:hidden}
.lli{display:flex;align-items:center;position:relative}
.lli + .lli::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:1px solid var(--sep)}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 4px 7px 10px;flex:1;min-width:0;text-align:left;min-height:44px}
.lrow .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ct{color:var(--text2);font-variant-numeric:tabular-nums}
.lli.on{background:var(--sel)}
.ledit{width:36px;height:44px;display:grid;place-items:center;color:var(--blue);opacity:0}
.lli:hover .ledit,.lli:focus-within .ledit{opacity:1}
.side-foot{margin-top:auto;position:sticky;bottom:0;background:var(--side);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px 14px}
.gbtn{width:100%;display:flex;align-items:center;gap:10px;background:var(--tile);border-radius:12px;padding:8px 10px;text-align:left;min-height:46px}
.gbtn .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#34C759;flex:none}
.gbtn .gt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.gbtn .gt small{color:var(--text2);font-size:12px}
.gbtn .gt small.warn{color:var(--orange)}
.gstat{padding:12px 14px;color:var(--text2);font-size:15px;margin:0}
.ghelp{margin:0 16px 12px;padding:0 4px;color:var(--text2);font-size:13px;line-height:1.55}
.ghelp ol{margin:6px 0 0;padding-left:18px}
.ghelp code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--fill);padding:1px 5px;border-radius:5px;word-break:break-all}
.row.act{color:var(--blue);justify-content:center}
.big.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;height:200px;white-space:pre;overflow:auto;color:var(--text2);border-bottom:1px solid var(--sep)}
.row.act:disabled{color:var(--text3);cursor:default}
.lnote{color:var(--text2);font-size:13px;text-align:center;margin:10px 0 0}
.addlist{color:var(--blue);display:inline-flex;gap:4px;align-items:center;font-weight:500}
.sync{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* Main */
.main{overflow-y:auto;background:var(--surface);padding:0 32px;display:flex;flex-direction:column;--c:var(--blue);scroll-padding-top:60px;scroll-padding-bottom:84px}
.mhead{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;align-items:center;height:52px;margin:0 -32px;padding:0 32px;flex:none}
.back{color:var(--blue);display:none;align-items:center;gap:0;font-size:17px;margin-left:-8px}
.acts{display:flex;gap:18px;margin-left:auto}

.content{flex:1 0 auto;padding-bottom:24px;max-width:860px;width:100%}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:4px 0 6px}
.ttl h1{font-size:32px;font-weight:700;margin:0;letter-spacing:-.015em;color:var(--c);overflow-wrap:anywhere}
.ttl .ct{font-size:32px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums;opacity:.9}
.done-line{display:flex;gap:14px;align-items:center;color:var(--text2);font-size:14px;padding:4px 0 10px;border-bottom:1px solid var(--sep)}
.done-line span{margin-right:auto}
.done-line button{color:var(--c);font-weight:500}
.rule{border-bottom:1px solid var(--sep);height:6px}
.sec-h{font-size:19px;font-weight:700;margin:26px 0 2px;color:var(--hc,var(--text));letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.sec-h small{font-size:14px;font-weight:500;color:var(--text2)}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:12px;padding-top:11px}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--text3);flex:none;display:grid;place-items:center;transition:border-color .15s}
.check span{width:14px;height:14px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .2s cubic-bezier(.3,1.5,.6,1)}
.item.done .check{border-color:var(--c)}
.item.done .check span{transform:scale(1)}
.item.draft .check{border-style:solid}
.tmr{flex:none;width:40px;height:22px;border-radius:11px;background:var(--fill);color:var(--blue);font-size:12px;font-weight:600;display:grid;place-items:center;transition:background-color .12s,color .12s}
.tmr:hover{background:var(--blue);color:#fff}
.tmr.off{visibility:hidden}
.mv{flex:none;width:26px;height:22px;border-radius:11px;background:var(--fill);color:var(--text2);display:grid;place-items:center;transition:background-color .12s,color .12s}
.mv:hover{background:var(--text2);color:var(--surface)}
.mv.off{opacity:.28;cursor:default}
.mv.off:hover{background:var(--fill);color:var(--text2)}
.appver{width:100%;font-size:11px;color:var(--text3);text-align:center;margin:-4px 0 0}

.cell{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--sep);padding-bottom:11px}
.txt{flex:1;min-width:0}
.tl{display:flex;align-items:flex-start}
.title{width:100%;border:0;background:none;resize:none;outline:none;padding:0;margin:0;font-size:16px;line-height:22px;height:22px;display:block;overflow:hidden;color:var(--text)}
.title::placeholder{color:var(--text3)}
.item.done .title{color:var(--text2)}
.notes{color:var(--text2);font-size:14px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--text2);margin-top:2px}
.meta .late{color:var(--red)}
.meta .lst{display:inline-flex;align-items:center;gap:5px}
.meta .lst i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.info{color:var(--blue);width:24px;height:24px;display:grid;place-items:center;opacity:0;transition:opacity .12s;flex:none}
.item:hover .info,.item:focus-within .info{opacity:1}
@media (hover:none){.info{opacity:1}}
.empty{color:var(--text2);text-align:center;margin:16vh 0 0;font-size:17px}
.newbar{position:sticky;bottom:0;background:var(--surface);padding:10px 0 14px;flex:none;max-width:860px;width:100%}
.newbtn{display:inline-flex;align-items:center;gap:7px;color:var(--c);font-weight:600;font-size:16px;padding:6px 0}
.newbtn .pl{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.loading{color:var(--text2);margin:30vh auto 0;text-align:center}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .18s ease-out}
.sheet{background:var(--bg);border-radius:14px;width:min(440px,100%);max-height:calc(100% - 40px);overflow:auto;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,.9,.3,1.1);padding-bottom:8px}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:1}
.sbar b{font-size:16px;font-weight:600}
.sbar .l{justify-self:start;color:var(--blue);font-size:16px}
.sbar .r{justify-self:end;color:var(--blue);font-size:16px;font-weight:600}
.sbar .r:disabled{color:var(--text3);cursor:default}
.grp{background:var(--tile);margin:0 16px 18px;border-radius:10px;overflow:hidden}

.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--sep)}

.big + .big{border-top:1px solid var(--sep)}
textarea.big{min-height:72px;color:var(--text)}
.ri{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.row select,.row input[type=date],.row input[type=time]{border:0;background:none;color:var(--blue);font-size:15px;outline:none;text-align:right;padding:6px 0;cursor:pointer}
.row select{appearance:none;-webkit-appearance:none;padding-right:2px}
.row .chev{color:var(--text3)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background-color .2s;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .2s cubic-bezier(.3,1.2,.6,1)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.danger{color:var(--red);justify-content:center}
.lprev{display:grid;place-items:center;padding:6px 0 18px}
.bigic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--pc) 45%,transparent)}
.namein{text-align:center;font-size:20px;font-weight:700;background:var(--fill);border-radius:10px;margin:0;padding:12px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;justify-items:center}
.sw-c,.sw-i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.sw-i{background:var(--fill);color:var(--text2)}
.sw-c[aria-pressed="true"]::after,.sw-i[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--text3)}
.cmsg{padding:22px 20px 18px;text-align:center;font-size:15px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 10px}
.cbtns button{height:44px;border-radius:10px;background:var(--tile);font-weight:600;font-size:16px}
.cbtns .go{background:var(--red);color:#fff}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(40,40,42,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast{display:flex;align-items:center;gap:14px}
#toast button{color:#4DA3FF;font-weight:600;font-size:14px}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

@media (max-width:760px){
  .app{display:flex;flex-direction:column}
  .side,.main{flex:1;min-height:0;border-right:0}
  .side{background:var(--bg)}
  .app[data-pane="main"] .side{display:none}
  .app[data-pane="side"] .main{display:none}
  .back{display:inline-flex}
  .main{padding:0 18px}
  .cell{gap:5px}
  .tmr{width:34px;font-size:11px}
  .mv{width:24px}
  .mhead{margin:0 -18px;padding:0 18px}
  .ttl h1,.ttl .ct{font-size:30px}
  .side-foot{background:var(--bg)}
  input:not([type=checkbox]),select,textarea:not(.code){font-size:16px!important}
  .app.searching .side{display:flex;flex:none;overflow:visible;padding-bottom:8px}
  .app.searching .side > :not(.side-top){display:none}
  .app.searching .main{display:flex}
  .app.searching .mhead{display:none}
  .scrim{place-items:end center;padding:0}
  .sheet{border-radius:14px 14px 0 0;width:100%;max-height:92%;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  @keyframes pop{from{transform:translateY(40%)}}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>
<div id="app" class="app" data-pane="side">
  <aside id="side" class="side" aria-label="목록"></aside>
  <main id="main" class="main"><p class="loading">불러오는 중…</p></main>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g, '');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = '일월화수목금토';
function dateLabel(s) {
  const t = today();
  if (s === t) return '오늘';
  if (s === addDays(t, 1)) return '내일';
  if (s === addDays(t, -1)) return '어제';
  const d = parse(s), now = new Date();
  return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
function headLabel(s) {
  const d = parse(s), t = today();
  const base = `${d.getMonth() + 1}월 ${d.getDate()}일`;
  if (s === t) return ['오늘', base];
  if (s === addDays(t, 1)) return ['내일', base];
  return [base, WD[d.getDay()] + '요일'];
}
function timeLabel(t) {
  const [h, m] = t.split(':').map(Number);
  return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(m)}`;
}
function isLate(it) {
  if (!it.due || it.completed) return false;
  const t = today();
  if (it.due < t) return true;
  if (it.due === t && it.time) { const n = new Date(); return it.time < `${pad(n.getHours())}:${pad(n.getMinutes())}`; }
  return false;
}

const svg = (inner, { fill = false, size = 18, sw = 2 } = {}) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

const ICONS = {
  list:  { p: '<path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle cx="5" cy="6.5" r="1.1" fill="currentColor"/><circle cx="5" cy="12" r="1.1" fill="currentColor"/><circle cx="5" cy="17.5" r="1.1" fill="currentColor"/>' },
  star:  { p: '<path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z"/>', f: true },
  heart: { p: '<path d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6z"/>', f: true },
  home:  { p: '<path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.5 9.5V19.5h11V9.5"/><path d="M10.5 19.5v-5h3v5"/>' },
  work:  { p: '<rect x="3.5" y="7.5" width="17" height="12" rx="2.2"/><path d="M9 7.5V5.6c0-.6.4-1.1 1-1.1h4c.6 0 1 .5 1 1.1v1.9"/><path d="M3.5 12.5h17"/>' },
  book:  { p: '<path d="M4.5 5.5c0-1 .8-1.8 1.8-1.8H19.5v14H6.3c-1 0-1.8.8-1.8 1.8"/><path d="M4.5 5.5v13.9c0 1 .8 1.8 1.8 1.8H19.5"/>' },
  cart:  { p: '<path d="M3.5 4.5h2.2l2.1 10.2h10l2-7.2H6.5"/><circle cx="9.3" cy="19" r="1.3" fill="currentColor"/><circle cx="16.7" cy="19" r="1.3" fill="currentColor"/>' },
  med:   { p: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>' },
  bolt:  { p: '<path d="M13.2 3.2 5.5 13.5h6l-1 7.3 7.8-10.4h-6.1z"/>', f: true },
  plane: { p: '<path d="M21 4 3.5 10.5l7 2.5 2.5 7z"/><path d="m10.5 13 4.5-4.5"/>' },
  music: { p: '<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>' },
  paw:   { p: '<circle cx="7" cy="10" r="1.8"/><circle cx="11" cy="6.5" r="1.8"/><circle cx="15.5" cy="7" r="1.8"/><circle cx="18" cy="11" r="1.8"/><path d="M12.5 12c-3 0-5 3.6-5 5.4 0 1.5 1.2 2.1 2.6 1.8 1-.2 1.6-.6 2.4-.6s1.4.4 2.4.6c1.4.3 2.6-.3 2.6-1.8 0-1.8-2-5.4-5-5.4z"/>' }
};
const iconSvg = (k, size = 18) => { const i = ICONS[k] || ICONS.list; return svg(i.p, { fill: !!i.f, size, sw: i.f ? 1.2 : 2 }); };
const COLORS = ['#FF3B30','#FF9500','#FFCC00','#34C759','#5AC8FA','#007AFF','#5856D6','#AF52DE','#FF2D55','#A2845E','#8E8E93','#3A3A3C'];

const G = {
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>', { size: 16, sw: 2.2 }),
  chev:   svg('<path d="M15 5 8 12l7 7"/>', { size: 24, sw: 2.4 }),
  up:     svg('<path d="m6 15 6-6 6 6"/>', { size: 14, sw: 2.6 }),
  down:   svg('<path d="m6 9 6 6 6-6"/>', { size: 14, sw: 2.6 }),
  chevR:  svg('<path d="m9 6 6 6-6 6"/>', { size: 14, sw: 2.4 }),
  plus:   svg('<path d="M12 6v12M6 12h12"/>', { size: 16, sw: 2.6 }),
  plusS:  svg('<path d="M12 6v12M6 12h12"/>', { size: 18, sw: 2.2 }),
  info:   svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor"/>', { size: 20, sw: 1.7 }),
  cal:    svg('<rect x="3.8" y="5" width="16.4" height="15" rx="2.5"/><path d="M3.8 9.8h16.4M8 3.2v3.4M16 3.2v3.4"/><circle cx="8.5" cy="14" r=".9" fill="currentColor"/><circle cx="12" cy="14" r=".9" fill="currentColor"/><circle cx="15.5" cy="14" r=".9" fill="currentColor"/>', { size: 17, sw: 1.9 }),
  clock:  svg('<circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 2"/>', { size: 17, sw: 2 }),
  tray:   svg('<path d="M4 13.5 6.4 6.3c.2-.5.6-.8 1.1-.8h9c.5 0 .9.3 1.1.8L20 13.5V18c0 .8-.7 1.5-1.5 1.5h-13c-.8 0-1.5-.7-1.5-1.5z"/><path d="M4 13.5h4.3l1.2 2.2h5l1.2-2.2H20"/>', { size: 17, sw: 1.9 }),
  check:  svg('<path d="m5.5 12.5 4.2 4.2 8.8-9.4"/>', { size: 17, sw: 2.6 }),
  folder: svg('<path d="M3.5 7c0-1 .8-1.8 1.8-1.8h4.3l2 2.2h7.1c1 0 1.8.8 1.8 1.8v8.3c0 1-.8 1.8-1.8 1.8H5.3c-1 0-1.8-.8-1.8-1.8z"/>', { size: 17, sw: 1.9 })
};
const todayIcon = () => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.8" y="5" width="16.4" height="15" rx="2.5"/><path d="M3.8 9.8h16.4M8 3.2v3.4M16 3.2v3.4" stroke-linecap="round"/><text x="12" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system,Segoe UI,sans-serif">${new Date().getDate()}</text></svg>`;

const SMART = {
  today:     { label: '오늘',     color: '#007AFF',     icon: () => todayIcon() },
  scheduled: { label: '예정',     color: '#FF3B30',     icon: () => G.cal },
  all:       { label: '전체',     color: 'var(--allc)', icon: () => G.tray },
  completed: { label: '완료됨',   color: '#8E8E93',     icon: () => G.check }
};

let toastT;
function toast(msg, action) {
  const t = $('#toast'); t.textContent = msg;
  if (action) {
    const b = document.createElement('button'); b.textContent = action.label;
    b.onclick = () => { t.classList.remove('show'); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
function onStoreError(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다. 완료된 미리알림을 지워 주세요.');
  else if (code === 'revoked' || code === 'not_granted') toast('이 화면에서는 변경 내용을 저장할 수 없습니다.');
  else toast('변경 내용을 저장하지 못했습니다. 다시 시도해 주세요.');
}

const defaultList = () => ({ id: 'default', name: '미리알림', color: '#007AFF', icon: 'list', order: 0 });
const strip = o => { const { id, ...rest } = o; return rest; };

/* ---------- stores ---------- */
function makeLocalStore() {
  const KEY = 'reminders.v1';
  let data = { lists: {}, items: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (p && p.lists && p.items) data = p; } } catch (e) {}
  const subs = [];
  const emit = () => subs.forEach(f => f());
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  if (!Object.keys(data.lists).length) { data.lists.default = defaultList(); persist(); }
  return {
    mode: 'local', ready: true,
    lists: () => Object.values(data.lists),
    items: () => Object.values(data.items),
    subscribe(f) { subs.push(f); f(); },
    saveList(l) { data.lists[l.id] = l; persist(); emit(); },
    removeList(id) { delete data.lists[id]; persist(); emit(); },
    saveItem(i) { data.items[i.id] = i; persist(); emit(); },
    removeItem(id) { delete data.items[id]; persist(); emit(); }
  };
}

function makeCloudStore(db, userId) {
  const root = db.doc(`data/users/${userId}/state`);
  const cols = { lists: root.collection('lists'), items: root.collection('items') };
  const base = { lists: new Map(), items: new Map() };
  const pend = { lists: new Map(), items: new Map() };
  const got = { lists: false, items: false };
  const seen = { lists: false, items: false };
  const chains = new Map();
  const subs = [];
  let madeDefault = false;
  const emit = () => subs.forEach(f => f());
  const view = k => { const m = new Map(base[k]); for (const [id, v] of pend[k]) { if (v === null) m.delete(id); else m.set(id, v); } return [...m.values()]; };

  function write(k, id, val) {
    pend[k].set(id, val); emit();
    const key = k + '/' + id;
    const prev = chains.get(key) || Promise.resolve();
    const p = prev.then(() => val === null ? cols[k].doc(id).delete() : cols[k].doc(id).set(strip(val)))
      .then(() => { if (pend[k].get(id) === val) pend[k].delete(id); })
      .catch(e => { if (pend[k].get(id) === val) pend[k].delete(id); emit(); onStoreError(e); });
    chains.set(key, p);
  }

  const st = {
    mode: 'cloud', ready: false,
    lists: () => view('lists'),
    items: () => view('items'),
    subscribe(f) { subs.push(f); f(); },
    saveList: l => write('lists', l.id, l),
    removeList: id => write('lists', id, null),
    saveItem: i => write('items', i.id, i),
    removeItem: id => write('items', id, null)
  };

  for (const k of ['lists', 'items']) {
    cols[k].onSnapshot(snap => {
      const m = new Map();
      snap.docs.forEach(d => { if (d.exists) m.set(d.id, { ...d.data(), id: d.id }); });
      base[k] = m; seen[k] = true;
      if (!snap.metadata.fromCache) got[k] = true;
      if (k === 'lists' && got.lists && !madeDefault && m.size === 0 && pend.lists.size === 0) {
        madeDefault = true; write('lists', 'default', defaultList());
      }
      st.ready = seen.lists && seen.items;
      emit();
    }, e => onStoreError(e));
  }
  return st;
}

/* ---------- state ---------- */
const S = {
  sel: { t: 'smart', id: 'today' },
  pane: 'side',
  showDone: {},
  search: '',
  editing: null,
  draft: null,
  linger: new Set(),
  composing: false,
  rendering: false,
  pending: false
};
let store = null;

const lists = () => store.lists().slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(String(b.name), 'ko'));
const items = () => store.items();
const listById = id => store.lists().find(l => l.id === id);
const viewKey = () => S.sel.t + ':' + S.sel.id;
function defaultListId() {
  const ls = lists();
  if (ls.length) return ls[0].id;
  store.saveList(defaultList());
  return 'default';
}

/* ---------- view model ---------- */
const APP_VERSION = '2026.09.30-reorder2';
const sortKey = i => (typeof i.order === 'number' ? i.order : (i.createdAt || 0));
function currentView() {
  const T = today();
  const ls = lists();
  const lmap = new Map(ls.map(l => [l.id, l]));
  const all = items().filter(i => lmap.has(i.listId));
  const show = !!S.showDone[viewKey()];
  const vis = i => !i.completed || show || S.linger.has(i.id);
  const byOrder = (a, b) => sortKey(a) - sortKey(b);
  const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || byOrder(a, b);
  const byDone = (a, b) => (!!a.completed - !!b.completed);

  const q = S.search.trim().toLowerCase();
  if (q) {
    const hit = all.filter(i => (i.title || '').toLowerCase().includes(q) || (i.notes || '').toLowerCase().includes(q));
    const sections = ls.map(l => ({ header: l.name, hc: l.color, items: hit.filter(i => i.listId === l.id).sort((a, b) => byDone(a, b) || byOrder(a, b)) })).filter(s => s.items.length);
    return { title: `‘${S.search.trim()}’ 검색 결과`, color: 'var(--text)', sections, search: true, noAdd: true, empty: '일치하는 미리알림이 없습니다' };
  }

  if (S.sel.t === 'list') {
    const l = lmap.get(S.sel.id);
    if (l) {
      const its = all.filter(i => i.listId === l.id);
      const done = its.filter(i => i.completed);
      return {
        title: l.name, color: l.color, list: l,
        sections: [{ items: its.filter(vis).sort(byDue), draftHere: true, movable: true }],
        count: its.length - done.length, done, doneLine: true,
        addCtx: { listId: l.id }, empty: '미리알림 없음'
      };
    }
    S.sel = { t: 'smart', id: 'today' };
  }

  const id = S.sel.id, meta = SMART[id] || SMART.today;
  const base = { title: meta.label, color: meta.color, smart: true, doneLine: true, empty: '미리알림 없음' };

  if (id === 'completed') {
    const its = all.filter(i => i.completed).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    return { ...base, sections: [{ items: its }], count: its.length, doneLine: false, noAdd: true, done: [], empty: '완료된 미리알림 없음' };
  }
  if (id === 'today') {
    const match = i => i.due && (i.completed ? i.due === T : i.due <= T);
    const its = all.filter(match);
    return { ...base, sections: [{ items: its.filter(vis).sort(byDue), draftHere: true, movable: true }], count: its.filter(i => !i.completed).length, done: its.filter(i => i.completed), addCtx: { due: T } };
  }
  if (id === 'scheduled') {
    const its = all.filter(i => i.due);
    const shown = its.filter(vis).sort(byDue);
    const groups = new Map();
    for (const i of shown) {
      const k = (!i.completed && i.due < T) ? 'past' : i.due;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(i);
    }
    if (S.draft && !groups.has(T)) groups.set(T, []);
    const keys = [...groups.keys()].sort((a, b) => a === 'past' ? -1 : b === 'past' ? 1 : a.localeCompare(b));
    const sections = keys.map(k => {
      if (k === 'past') return { header: '지난 항목', hc: 'var(--red)', items: groups.get(k), movable: true };
      const [h, s] = headLabel(k);
      return { header: h, sub: s, items: groups.get(k), draftHere: k === T, movable: true };
    });
    return { ...base, sections, count: its.filter(i => !i.completed).length, done: its.filter(i => i.completed), addCtx: { due: T } };
  }
  // all
  const defId = ls.length ? ls[0].id : null;
  const sections = ls.map(l => ({ header: l.name, hc: l.color, items: all.filter(i => i.listId === l.id && vis(i)).sort(byDue), draftHere: l.id === defId, listRow: true, movable: true }));
  return { ...base, sections, count: all.filter(i => !i.completed).length, done: all.filter(i => i.completed), addCtx: {}, keepEmptySections: true };
}

/* ---------- rendering ---------- */
function grow(t) {
  if (t.offsetParent === null) return;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}
function paint(el, html) {
  const a = document.activeElement;
  let key = null, s = 0, e = 0;
  if (a && el.contains(a) && a.dataset && a.dataset.key) {
    key = a.dataset.key;
    if (typeof a.selectionStart === 'number') { s = a.selectionStart; e = a.selectionEnd; }
  }
  const top = el.scrollTop;
  S.rendering = true;
  el.innerHTML = html;
  el.scrollTop = top;
  el.querySelectorAll('textarea.title').forEach(grow);
  if (key) {
    const n = el.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (n) { n.focus({ preventScroll: true }); try { n.setSelectionRange(s, e); } catch (err) {} }
  }
  S.rendering = false;
}

function renderSide() {
  const T = today();
  const ls = lists();
  const ids = new Set(ls.map(l => l.id));
  const act = items().filter(i => !i.completed && ids.has(i.listId));
  const cnt = {
    today: act.filter(i => i.due && i.due <= T).length,
    scheduled: act.filter(i => i.due).length,
    all: act.length,
    completed: ''
  };
  const searching = !!S.search.trim();
  let h = `<div class="side-top"><label class="search">${G.search}<input id="search" type="search" data-key="search" placeholder="검색" autocomplete="off" value="${esc(S.search)}" aria-label="미리알림 검색"></label></div>`;
  h += `<div class="tiles">`;
  for (const [k, m] of Object.entries(SMART)) {
    const on = !searching && S.sel.t === 'smart' && S.sel.id === k;
    h += `<button class="tile${on ? ' on' : ''}" style="--c:${m.color}" data-act="select" data-t="smart" data-id="${k}" aria-current="${on}"><span class="ic">${m.icon()}</span><span class="n">${cnt[k]}</span><span class="lbl">${m.label}</span></button>`;
  }
  h += `</div><h2 class="side-h">나의 목록</h2><ul class="lists">`;
  for (const l of ls) {
    const on = !searching && S.sel.t === 'list' && S.sel.id === l.id;
    const n = act.filter(i => i.listId === l.id).length;
    h += `<li class="lli${on ? ' on' : ''}"><button class="lrow" data-act="select" data-t="list" data-id="${esc(l.id)}" aria-current="${on}"><span class="ic" style="background:${esc(l.color)}">${iconSvg(l.icon, 17)}</span><span class="nm">${esc(l.name)}</span><span class="ct">${n}</span></button><button class="ledit" data-act="edit-list" data-id="${esc(l.id)}" aria-label="${esc(l.name)} 목록 편집">${G.info}</button></li>`;
  }
  h += `</ul><div class="side-foot">`;
  h += `<button class="gbtn" data-act="google"><span class="ic">${G.check}</span><span class="gt"><span>Google 할 일</span><small class="${GS.warn() ? 'warn' : ''}">${esc(GS.label())}</small></span><span class="chev" style="color:var(--text3)">${G.chevR}</span></button>`;
  h += store.mode === 'cloud'
    ? `<span class="sync" style="--c:var(--green)"><i></i>기기 간 동기화됨</span>`
    : GS.enabled
      ? `<span class="sync" style="--c:var(--green)"><i></i>Google로 기기 간 동기화</span>`
      : `<span class="sync" style="--c:var(--orange)"><i></i>이 브라우저에만 저장됨</span>`;
  h += `<button class="addlist" data-act="add-list">${G.plusS}목록 추가</button><p class="appver">버전 ${APP_VERSION}</p></div>`;
  paint($('#side'), h);
}

function itemHTML(it, showList, nav) {
  const l = listById(it.listId);
  const c = l ? l.color : '#007AFF';
  const title = S.editing && S.editing.id === it.id ? S.editing.text : it.title;
  let meta = '';
  if (it.due) meta += `<span class="${isLate(it) ? 'late' : ''}">${dateLabel(it.due)}${it.time ? ', ' + timeLabel(it.time) : ''}</span>`;
  if (showList && l) meta += `<span class="lst"><i></i>${esc(l.name)}</span>`;
  return `<li class="item${it.completed ? ' done' : ''}" style="--c:${esc(c)}" data-id="${esc(it.id)}">`
    + `<button class="check" data-act="toggle" aria-label="${it.completed ? '완료 취소' : '완료로 표시'}" aria-pressed="${!!it.completed}"><span></span></button>`
    + `<div class="cell"><div class="txt"><div class="tl">`
    + `<textarea class="title" rows="1" data-key="t:${esc(it.id)}" data-role="title" aria-label="미리알림 제목" spellcheck="false">${esc(title)}</textarea></div>`
    + (it.notes ? `<div class="notes">${esc(it.notes)}</div>` : '')
    + (meta ? `<div class="meta">${meta}</div>` : '')
    + `</div>`
    + (it.completed ? '' :
        `<button class="tmr" data-act="minus1" aria-label="하루 앞으로 당기기">-1일</button>`
        + (it.due === today()
          ? `<span class="tmr off" aria-hidden="true">오늘</span>`
          : `<button class="tmr" data-act="today" aria-label="오늘로 옮기기">오늘</button>`)
        + `<button class="tmr" data-act="plus1" aria-label="하루 뒤로 미루기">+1일</button>`)
    + (nav
        ? (nav.up ? `<button class="mv" data-act="move" data-swap="${esc(nav.up)}" aria-label="위로 이동">${G.up}</button>` : `<span class="mv off" title="같은 날짜 안에서만 이동할 수 있습니다" aria-hidden="true">${G.up}</span>`)
          + (nav.down ? `<button class="mv" data-act="move" data-swap="${esc(nav.down)}" aria-label="아래로 이동">${G.down}</button>` : `<span class="mv off" title="같은 날짜 안에서만 이동할 수 있습니다" aria-hidden="true">${G.down}</span>`)
        : '')
    + `<button class="info" data-act="info" aria-label="세부사항 보기">${G.info}</button></div></li>`;
}
function draftHTML(color) {
  return `<li class="item draft" style="--c:${esc(color)}"><span class="check" aria-hidden="true"></span><div class="cell"><div class="txt"><div class="tl">`
    + `<textarea class="title" rows="1" data-key="draft" data-role="draft" placeholder="새로운 미리알림" aria-label="새로운 미리알림" spellcheck="false">${esc(S.draft.text)}</textarea></div></div></div></li>`;
}

function renderMain() {
  const main = $('#main');
  if (!store || !store.ready) { main.innerHTML = '<p class="loading">불러오는 중…</p>'; return; }
  const v = currentView();
  main.style.setProperty('--c', v.color);
  const showList = !!v.smart && S.sel.id !== 'all' || !!v.search;
  const draftColor = (() => {
    if (v.list) return v.list.color;
    const lid = (v.addCtx && v.addCtx.listId) || (lists()[0] || {}).id;
    const l = listById(lid); return l ? l.color : '#007AFF';
  })();

  let h = `<header class="mhead"><button class="back" data-act="back">${G.chev}목록</button><div class="acts">`;
  if (v.list) h += `<button data-act="edit-list" data-id="${esc(v.list.id)}">목록 편집</button>`;
  h += `</div></header><div class="content" data-act-bg="1">`;
  h += `<div class="ttl"><h1>${esc(v.title)}</h1>${v.search ? '' : `<span class="ct">${v.count}</span>`}</div>`;

  if (v.doneLine && v.done && v.done.length) {
    const shown = !!S.showDone[viewKey()];
    h += `<div class="done-line"><span>완료됨 ${v.done.length}개</span><button data-act="clear-done">지우기</button><button data-act="toggle-done">${shown ? '가리기' : '보기'}</button></div>`;
  } else {
    h += `<div class="rule"></div>`;
  }

  let any = false, draftPlaced = false;
  for (const sec of v.sections) {
    const hasItems = sec.items.length > 0;
    const wantsDraft = S.draft && sec.draftHere && !draftPlaced;
    if (!hasItems && !wantsDraft && !v.keepEmptySections) continue;
    if (sec.header) h += `<h2 class="sec-h" style="--hc:${esc(sec.hc || 'var(--text)')}">${esc(sec.header)}${sec.sub ? `<small>${esc(sec.sub)}</small>` : ''}</h2>`;
    h += `<ul class="items">`;
    sec.items.forEach((it, n) => {
      let nav = null;
      if (sec.movable && !it.completed) {
        const same = x => x && !x.completed && (x.due || null) === (it.due || null);
        const prev = sec.items[n - 1], next = sec.items[n + 1];
        nav = { up: same(prev) ? prev.id : null, down: same(next) ? next.id : null };
      }
      h += itemHTML(it, showList, nav); any = true;
    });
    if (wantsDraft) { h += draftHTML(draftColor); draftPlaced = true; }
    h += `</ul>`;
  }
  if (S.draft && !draftPlaced && !v.noAdd) { h += `<ul class="items">${draftHTML(draftColor)}</ul>`; draftPlaced = true; }
  if (!any && !draftPlaced && !v.keepEmptySections) h += `<p class="empty">${esc(v.empty)}</p>`;
  h += `</div>`;
  if (!v.noAdd) h += `<div class="newbar"><button class="newbtn" data-act="new"><span class="pl">${G.plus}</span>새로운 미리알림</button></div>`;
  paint(main, h);
}

function render() {
  if (S.composing) { S.pending = true; return; }
  S.pending = false;
  const app = $('#app');
  app.dataset.pane = S.pane;
  app.classList.toggle('searching', !!S.search.trim());
  if (!store) return;
  renderSide();
  renderMain();
}

/* ---------- actions ---------- */
function startDraft() {
  const v = currentView();
  if (v.noAdd) return;
  S.draft = { text: '' };
  renderMain();
  const t = $('#main [data-key="draft"]');
  if (t) { t.focus(); t.scrollIntoView({ block: 'nearest' }); }
}
function commitDraft(text) {
  const title = text.replace(/\s*\n\s*/g, ' ').trim();
  if (!title) return false;
  const ctx = currentView().addCtx || {};
  store.saveItem({
    id: newId(), title, notes: '',
    listId: ctx.listId || defaultListId(),
    due: ctx.due || null, time: null,
    completed: false, completedAt: null,
    createdAt: Date.now()
  });
  return true;
}
function toggle(id) {
  const it = items().find(i => i.id === id); if (!it) return;
  const done = !it.completed;
  if (done && !S.showDone[viewKey()] && S.sel.id !== 'completed') {
    S.linger.add(id);
    setTimeout(() => { S.linger.delete(id); render(); }, 1500);
  }
  store.saveItem({ ...it, completed: done, completedAt: done ? Date.now() : null });
}
function swapOrder(id, otherId) {
  const a = items().find(i => i.id === id), b = items().find(i => i.id === otherId);
  if (!a || !b) return;
  let ka = sortKey(a), kb = sortKey(b);
  if (ka === kb) kb = ka + (sortKey(a) <= sortKey(b) ? 1 : -1);
  store.saveItem({ ...a, order: kb });
  store.saveItem({ ...b, order: ka });
}
function moveTo(id, due) {
  const it = items().find(i => i.id === id); if (!it) return;
  const prev = { ...it };
  store.saveItem({ ...it, due });
  toast(`${dateLabel(due)}로 옮겼습니다`, { label: '실행 취소', fn: () => {
    const cur = items().find(i => i.id === id);
    if (cur) store.saveItem({ ...cur, due: prev.due, time: prev.time });
  } });
}
function select(t, id) {
  S.sel = { t, id }; S.draft = null; S.pane = 'main';
  if (S.search) S.search = '';
  render();
  $('#main').scrollTop = 0;
}

/* ---------- sheets ---------- */
const overlay = $('#overlay');
let lastFocus = null;
function openSheet(label, html, onClick, onMount) {
  lastFocus = document.activeElement;
  overlay.innerHTML = `<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div></div>`;
  overlay.onclick = e => {
    if (e.target.dataset && e.target.dataset.scrim) { closeSheet(); return; }
    onClick(e);
  };
  if (onMount) onMount(overlay.querySelector('.sheet'));
}
function closeSheet() {
  overlay.innerHTML = ''; overlay.onclick = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
const sheetOpen = () => !!overlay.firstChild;

function confirmSheet(msg, go, fn) {

    if (b.dataset.s === 'cancel') closeSheet();
    else if (b.dataset.s === 'delete') { closeSheet(); store.removeItem(id); }
    else if (b.dataset.s === 'done') {
      const f = n => s.querySelector(`[name="${n}"]`);
      const cur = items().find(i => i.id === id) || it;
      const hasDate = f('hasDate').checked, hasTime = f('hasTime').checked && hasDate;
      const title = f('title').value.trim() || cur.title;
      store.saveItem({
        ...cur, title,
        notes: f('notes').value.replace(/\s+$/, ''),
        due: hasDate ? (f('due').value || T) : null,
        time: hasTime ? (f('time').value || '09:00') : null,
        listId: f('listId').value || cur.listId
      });
      closeSheet();
    }
  }, s => {
    const f = n => s.querySelector(`[name="${n}"]`);
    const sync = () => {
      s.querySelector('[data-for="date"]').hidden = !f('hasDate').checked;
      s.querySelector('[data-for="time"]').hidden = !f('hasTime').checked;
    };
    f('hasDate').addEventListener('change', () => { if (!f('hasDate').checked) f('hasTime').checked = false; sync(); });
    f('hasTime').addEventListener('change', () => { if (f('hasTime').checked) f('hasDate').checked = true; sync(); });
    const ta = f('notes');
    const g = () => { ta.style.height = 'auto'; ta.style.height = Math.max(72, ta.scrollHeight) + 'px'; };
    ta.addEventListener('input', g); g();
    f('title').focus();
  });
}

function openListSheet(id) {
  const l = id ? listById(id) : null;
  let color = l ? l.color : '#007AFF', icon = l ? l.icon : 'list';
  const canDelete = l && lists().length > 1;
  const isG = false;
  const html = `
    <div class="sbar"><button class="l" data-s="cancel">취소</button><b>${l ? '목록 정보' : '새로운 목록'}</b><button class="r" data-s="done">완료</button></div>
    <div class="grp pad">
      <div class="lprev"><span class="bigic" style="background:${esc(color)};--pc:${esc(color)}">${iconSvg(icon, 40)}</span></div>
      <input class="big namein" name="name" value="${esc(l ? l.name : '')}" placeholder="목록 이름" maxlength="60" aria-label="목록 이름" style="color:${esc(color)}" ${isG ? 'readonly' : ''}>${isG ? '<p class="lnote">Google 할 일과 연결된 목록입니다. 이름은 Google에서 바꿔 주세요.</p>' : ''}
    </div>
    <div class="grp pad"><div class="swatches" role="group" aria-label="색상">${COLORS.map(c => `<button class="sw-c" data-color="${c}" style="background:${c}" aria-label="색상 ${c}" aria-pressed="${c === color}"></button>`).join('')}</div></div>
    <div class="grp pad"><div class="swatches" role="group" aria-label="아이콘">${Object.keys(ICONS).map(k => `<button class="sw-i" data-icon="${k}" aria-label="아이콘 ${k}" aria-pressed="${k === icon}">${iconSvg(k, 18)}</button>`).join('')}</div></div>
    ${canDelete ? `<div class="grp"><button class="row danger" data-s="delete">목록 삭제</button></div>` : ''}`;
  openSheet(l ? '목록 정보' : '새로운 목록', html, e => {
    const s = overlay.querySelector('.sheet');
    const sc = e.target.closest('[data-color]'), si = e.target.closest('[data-icon]');
    if (sc || si) {
      if (sc) color = sc.dataset.color;
      if (si) icon = si.dataset.icon;
      s.querySelectorAll('[data-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === color));
      s.querySelectorAll('[data-icon]').forEach(b => b.setAttribute('aria-pressed', b.dataset.icon === icon));
      const pv = s.querySelector('.bigic'); pv.style.background = color; pv.style.setProperty('--pc', color); pv.innerHTML = iconSvg(icon, 40);
      s.querySelector('[name="name"]').style.color = color;
      return;
    }
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'cancel') closeSheet();
    else if (b.dataset.s === 'done') {
      const name = isG ? l.name : (s.querySelector('[name="name"]').value.trim() || '새로운 목록');
      const nl = { ...(l || {}), id: l ? l.id : newId(), name, color, icon, order: l ? (l.order ?? 0) : Date.now() };
      store.saveList(nl);
      closeSheet();
      if (!l) select('list', nl.id);
    } else if (b.dataset.s === 'delete') {
      const n = items().filter(i => i.listId === l.id).length;
      closeSheet();
      confirmSheet(`‘${l.name}’ 목록${n ? `과 미리알림 ${n}개` : ''}를 삭제할까요?${l.gListId ? ' Google 할 일과 다른 기기에서도 삭제됩니다.' : ''}`, '삭제', () => {
        items().filter(i => i.listId === l.id).forEach(i => store.removeItem(i.id));
        store.removeList(l.id);
        if (S.sel.t === 'list' && S.sel.id === l.id) { S.sel = { t: 'smart', id: 'today' }; }
        render();
      });
    }
  }, s => { const n = s.querySelector('[name="name"]'); n.focus(); n.select(); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#overlay')) return;
  const b = e.target.closest('[data-act]');
  if (!b) {
    const c = e.target.closest('.content');
    if (c && e.target === c && !S.draft) startDraft();
    return;
  }
  const act = b.dataset.act;
  const li = b.closest('.item');
  const id = b.dataset.id || (li && li.dataset.id);
  switch (act) {
    case 'select': select(b.dataset.t, b.dataset.id); break;
    case 'back': S.pane = 'side'; S.draft = null; render(); break;
    case 'toggle': toggle(id); break;
    case 'plus1': { const it = items().find(i => i.id === id); if (it) moveTo(id, addDays(it.due || today(), 1)); break; }
    case 'today': moveTo(id, today()); break;
    case 'move': swapOrder(id, b.dataset.swap); break;
    case 'minus1': { const it = items().find(i => i.id === id); if (it) moveTo(id, addDays(it.due || today(), -1)); break; }
    case 'info': openItemSheet(id); break;
    case 'new': startDraft(); break;
    case 'add-list': openListSheet(null); break;
    case 'google': openGoogleSheet(); break;
    case 'edit-list': openListSheet(id); break;
    case 'toggle-done': { const k = viewKey(); S.showDone[k] = !S.showDone[k]; render(); break; }
    case 'clear-done': {
      const v = currentView(); const done = v.done || [];
      if (!done.length) break;
      confirmSheet(`완료된 미리알림 ${done.length}개를 삭제할까요?`, '삭제', () => done.forEach(i => store.removeItem(i.id)));
      break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('#main textarea.title')) grow(t);
  const role = t.dataset && t.dataset.role;
  if (role === 'draft') { if (S.draft) S.draft.text = t.value; }
  else if (role === 'title') { const li = t.closest('.item'); if (li) S.editing = { id: li.dataset.id, text: t.value }; }
  else if (t.id === 'search') {
    S.search = t.value; S.draft = null;
    $('#app').classList.toggle('searching', !!S.search.trim());
    if (S.search.trim()) S.pane = 'main';
    $('#app').dataset.pane = S.pane;
    if (!S.composing) { renderMain(); $('#side').querySelectorAll('.tile,.lli').forEach(n => n.classList.remove('on')); }
  }
});

document.addEventListener('compositionstart', () => { S.composing = true; });
document.addEventListener('compositionend', e => {
  S.composing = false;
  const t = e.target;
  if (t.id === 'search') { S.search = t.value; renderMain(); }
  if (S.pending) setTimeout(render, 0);
});

document.addEventListener('focusin', e => {
  const t = e.target;
  if (S.rendering) return;
  if (t.dataset && t.dataset.role === 'title') { const li = t.closest('.item'); if (li) S.editing = { id: li.dataset.id, text: t.value }; }
});

document.addEventListener('focusout', e => {
  if (S.rendering) return;
  const t = e.target;
  const role = t.dataset && t.dataset.role;
  if (role === 'title') {
    const li = t.closest('.item'); const id = li && li.dataset.id;
    const it = items().find(i => i.id === id);
    const v = t.value.replace(/\s*\n\s*/g, ' ').trim();
    S.editing = null;
    if (!it) return;
    if (!v) store.removeItem(id);
    else if (v !== it.title) store.saveItem({ ...it, title: v });
    else setTimeout(render, 0);
  } else if (role === 'draft') {
    if (!S.draft) return;
    const v = t.value;
    S.draft = null;
    commitDraft(v);
    setTimeout(render, 0);
  } else if (t.id === 'search' && !S.search.trim()) {
    setTimeout(render, 0);
  }
});

document.addEventListener('keydown', e => {
  const t = e.target;
  const role = t.dataset && t.dataset.role;
  if (e.key === 'Escape') {
    if (sheetOpen()) { closeSheet(); return; }
    if (role === 'draft') { S.draft = null; t.blur(); renderMain(); return; }
    if (role === 'title') { t.blur(); return; }
    if (t.id === 'search' && S.search) { S.search = ''; t.value = ''; render(); return; }
    return;
  }
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  if (sheetOpen()) {
    if (t.tagName === 'INPUT' && t.type !== 'checkbox') { e.preventDefault(); const d = overlay.querySelector('[data-s="done"],[data-s="connect"]'); if (d) d.click(); }
    return;
  }
  if (role === 'draft') {
    e.preventDefault();
    if (commitDraft(t.value)) {
      S.draft = { text: '' };
      render();
      const d = $('#main [data-key="draft"]'); if (d) d.scrollIntoView({ block: 'nearest' });
    } else { S.draft = null; t.blur(); renderMain(); }
  } else if (role === 'title') {
    e.preventDefault(); t.blur();
  }
});

window.addEventListener('resize', () => document.querySelectorAll('#main textarea.title').forEach(grow));

/* ---------- Google Tasks sync (Apps Script bridge) ---------- */
const APPS_SCRIPT = [
"// 미리알림 웹앱 ↔ Google 할 일 중계 스크립트 (v2: 목록·시간·색상까지 기기 간 동기화)",
"// 편집기 왼쪽 '서비스'에서 Google Tasks API(식별자: Tasks)를 추가해야 동작합니다.",
"const SECRET = '__KEY__';",
"const VERSION = 2;",
"",
"function doPost(e) {",
"  let req;",
"  try { req = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'bad_request' }); }",
"  if (!req || req.key !== SECRET) return out({ ok: false, error: 'unauthorized' });",
"  const lock = LockService.getScriptLock();",
"  lock.waitLock(20000);",
"  try {",
"    const props = PropertiesService.getScriptProperties();",
"    const created = {};",
"    const results = (req.ops || []).map(function (o) { return runOp(o, created, props); });",
"    return out({ ok: true, version: VERSION, results: results, lists: pull(), meta: props.getProperties() });",
"  } catch (err) {",
"    return out({ ok: false, error: String((err && err.message) || err) });",
"  } finally {",
"    lock.releaseLock();",
"  }",
"}",
"",
"function doGet() { return out({ ok: true, name: 'reminders-bridge', version: VERSION }); }",
"",
"function res(v, created) { return (typeof v === 'string' && v.charAt(0) === '@') ? created[v.slice(1)] : v; }",
"",
"function runOp(o, created, props) {",
"  const r = { ref: o.ref, ok: true };",
"  try {",
"    const list = res(o.list, created), id = res(o.id, created);",
"    if ((o.list && !list) || (o.id && !id)) return { ref: o.ref, ok: false, error: 'unresolved' };",
"    if (o.op === 'insert') { const t = Tasks.Tasks.insert(o.body, list); created[o.ref] = t.id; r.id = t.id; r.updated = t.updated; r.list = list; }",
"    else if (o.op === 'patch') { const t = Tasks.Tasks.patch(o.body, list, id); r.id = t.id; r.updated = t.updated; r.list = list; }",
"    else if (o.op === 'delete') { props.deleteProperty('T:' + id); Tasks.Tasks.remove(list, id); }",
"    else if (o.op === 'createList') { const l = Tasks.Tasklists.insert({ title: o.title }); created[o.ref] = l.id; r.id = l.id; }",
"    else if (o.op === 'renameList') { Tasks.Tasklists.patch({ title: o.title }, list); }",
"    else if (o.op === 'deleteList') { props.deleteProperty('L:' + list); Tasks.Tasklists.remove(list); }",
"    else if (o.op === 'meta') {",
"      const k = o.kind + ':' + id;",
"      if (o.value == null || o.value === '') props.deleteProperty(k);",
"      else props.setProperty(k, typeof o.value === 'string' ? o.value : JSON.stringify(o.value));",
"    }",
"    else return { ref: o.ref, ok: false, error: 'unknown_op' };",
"    return r;",
"  } catch (err) {",
"    const m = String((err && err.message) || err);",
"    return { ref: o.ref, ok: false, notFound: /not ?found|404|deleted/i.test(m), error: m };",
"  }",
"}",
"",
"function pull() {",
"  const lists = [];",
"  let pt;",
"  do {",
"    const r = Tasks.Tasklists.list({ maxResults: 100, pageToken: pt });",
"    (r.items || []).forEach(function (l) { lists.push({ id: l.id, title: l.title, tasks: [] }); });",
"    pt = r.nextPageToken;",
"  } while (pt);",
"  lists.forEach(function (l) {",
"    let p;",
"    do {",
"      const r = Tasks.Tasks.list(l.id, { showCompleted: true, showHidden: true, maxResults: 100, pageToken: p });",
"      (r.items || []).forEach(function (t) {",
"        l.tasks.push({ id: t.id, title: t.title, notes: t.notes, status: t.status, due: t.due, completed: t.completed, updated: t.updated, deleted: t.deleted });",
"      });",
"      p = r.nextPageToken;",
"    } while (p);",
"  });",
"  return lists;",
"}",
"",
"function out(o) {",
"  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);",
"}"
].join('\n');

const GS = (() => {
  const LS = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  const genKey = () => {
    const a = new Uint8Array(18);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256);
    return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
  };
  const g = {
    url: LS.get('gbridge.url') || '', key: LS.get('gbridge.key') || '',
    enabled: LS.get('gbridge.enabled') === '1', v2: false,
    status: 'off', err: '', lastSync: 0, busy: false, again: false,
    raw: null, timer: null, pushT: null
  };
  if (!g.key) { g.key = genKey(); LS.set('gbridge.key', g.key); }
  const loadArr = k => { try { return JSON.parse(LS.get(k) || '[]') || []; } catch (e) { return []; } };
  let deletes = loadArr('gtasks.deletes');
  let listDeletes = loadArr('gtasks.listDeletes');
  const saveDeletes = () => { LS.set('gtasks.deletes', JSON.stringify(deletes)); LS.set('gtasks.listDeletes', JSON.stringify(listDeletes)); };
  const safeId = s => String(s).replace(/[^a-zA-Z0-9_-]/g, '');
  const parse = s => { try { return JSON.parse(s); } catch (e) { return null; } };

  function label() {
    if (!g.enabled) return g.url ? '연결 안 됨' : '설정 필요';
    if (g.status === 'syncing') return '동기화 중…';
    if (g.status === 'error') return '동기화 오류' + (g.err ? ` (${g.err})` : '');
    if (!g.lastSync) return '연결됨';
    const m = Math.floor((Date.now() - g.lastSync) / 60000);
    return m < 1 ? '방금 동기화됨' : `${m}분 전 동기화됨`;
  }
  const warn = () => g.enabled && g.status === 'error';
  function setStatus(s, err = '') {
    g.status = s; g.err = err;
    const el = document.getElementById('gs-status'); if (el) el.textContent = label();
    if (store) render();
  }

  async function call(ops) {
    let r;
    try {
      r = await fetch(g.url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key: g.key, ops })
      });
    } catch (e) { throw { msg: '연결 실패' }; }
    if (!r.ok) throw { msg: 'HTTP ' + r.status };
    let j;
    try { j = await r.json(); } catch (e) { throw { msg: '응답 형식 오류' }; }
    if (!j || !j.ok) throw { msg: j && j.error === 'unauthorized' ? '비밀 키 불일치' : ((j && j.error) || '스크립트 오류') };
    return j;
  }

  const toBody = it => ({
    title: it.title, notes: it.notes || '',
    status: it.completed ? 'completed' : 'needsAction',
    completed: it.completed ? new Date(it.completedAt || Date.now()).toISOString() : null,
    due: it.due ? it.due + 'T00:00:00.000Z' : null
  });
  const dirty = (o, prev) => ({ ...o, gDirty: true, gRev: ((prev && prev.gRev) || (o.gRev) || 0) + 1 });

  function buildOps() {
    const ops = [], lmeta = [], imeta = [];
    for (const l of store.lists().filter(x => x.gDirty)) {
      let ref;
      if (!l.gListId) { ops.push({ op: 'createList', title: l.name, ref: 'L' + l.id }); ref = '@L' + l.id; }
      else { ops.push({ op: 'renameList', list: l.gListId, title: l.name, ref: 'R' + l.id }); ref = l.gListId; }
      ops.push({ op: 'meta', kind: 'L', id: ref, value: { color: l.color, icon: l.icon, order: l.order ?? 0 }, ref: 'M' + l.id });
      lmeta.push({ id: l.id, rev: l.gRev, created: !l.gListId });
    }
    const nDel = deletes.length, nLDel = listDeletes.length;
    deletes.forEach((d, i) => ops.push({ op: 'delete', list: d.gList, id: d.gid, ref: 'd' + i }));
    listDeletes.forEach((id, i) => ops.push({ op: 'deleteList', list: id, ref: 'D' + i }));
    for (const it of store.items().filter(i => i.gDirty)) {
      const l = listById(it.listId);
      const target = l ? (l.gListId || (l.gDirty ? '@L' + l.id : null)) : null;
      if (!target) continue;
      const m = { id: it.id, rev: it.gRev, gid: it.gid || null, gList: it.gList || null };
      if (m.gid && m.gList !== target) {
        ops.push({ op: 'delete', list: m.gList, id: m.gid, ref: 'x' + it.id });
        m.gid = null; m.gList = null;
      }
      if (m.gid) ops.push({ op: 'patch', list: m.gList, id: m.gid, body: toBody(it), ref: 'p' + it.id });
      else ops.push({ op: 'insert', list: target, body: toBody(it), ref: 'i' + it.id });
      ops.push({ op: 'meta', kind: 'T', id: m.gid || '@i' + it.id, value: { t: it.time || null, o: sortKey(it) }, ref: 't' + it.id });
      imeta.push(m);
    }
    return { ops, lmeta, imeta, nDel, nLDel };
  }

  function applyResults(results, b) {
    const R = new Map((results || []).map(r => [r.ref, r]));
    const okish = r => r && (r.ok || r.notFound);
    let failed = 0;
    for (const m of b.lmeta) {
      const cur = store.lists().find(l => l.id === m.id);
      const r = R.get((m.created ? 'L' : 'R') + m.id);
      if (!cur) { if (m.created && r && r.ok) { listDeletes.push(r.id); g.again = true; } continue; }
      const ok = m.created ? !!(r && r.ok) : okish(r);
      if (!ok) failed++;
      g.raw.saveList({ ...cur, gListId: m.created ? (r && r.ok ? r.id : null) : cur.gListId, gDirty: !ok || cur.gRev !== m.rev });
      if (m.created && r && r.ok) g.again = true;
    }
    const keep = [];
    for (let i = 0; i < b.nDel; i++) if (!okish(R.get('d' + i))) keep.push(deletes[i]);
    deletes = keep.concat(deletes.slice(b.nDel));
    const keepL = [];
    for (let i = 0; i < b.nLDel; i++) if (!okish(R.get('D' + i))) keepL.push(listDeletes[i]);
    listDeletes = keepL.concat(listDeletes.slice(b.nLDel));
    failed += keep.length + keepL.length;
    for (const m of b.imeta) {
      const cur = store.items().find(i => i.id === m.id);
      const rp = R.get('p' + m.id), ri = R.get('i' + m.id);
      let gid = m.gid, gList = m.gList, gUpdated = null, ok = true;
      if (rp) {
        if (rp.ok) gUpdated = rp.updated;
        else if (rp.notFound) { gid = null; gList = null; ok = false; g.again = true; }
        else ok = false;
      }
      if (ri) {
        if (ri.ok) { gid = ri.id; gList = ri.list; gUpdated = ri.updated; }
        else ok = false;
      }
      if (!cur) {
        if (ri && ri.ok) { deletes.push({ gid: ri.id, gList: ri.list }); g.again = true; }
        continue;
      }
      if (!ok && !(rp && rp.notFound)) failed++;
      g.raw.saveItem({ ...cur, gid, gList, gUpdated: gUpdated || (gid ? cur.gUpdated : null) || null, gDirty: !ok || cur.gRev !== m.rev });
    }
    saveDeletes();
    return failed;
  }

  function markItemsDirty(listId) {
    store.items().filter(i => i.listId === listId && !i.gDirty).forEach(i => g.raw.saveItem(dirty(i)));
  }

  function applyPull(gl, meta) {
    const T = today();
    const live = new Set(gl.map(x => x.id));
    const byG = new Map(store.lists().filter(l => l.gListId).map(l => [l.gListId, l]));
    const unlinked = store.lists().filter(l => !l.gListId && !l.gDirty);
    gl.forEach((x, n) => {
      const mt = parse(meta['L:' + x.id]) || {};
      const l = byG.get(x.id);
      if (!l) {
        const same = unlinked.find(u => u.name === x.title);
        if (same) {
          unlinked.splice(unlinked.indexOf(same), 1);
          g.raw.saveList({ ...same, gListId: x.id });
          markItemsDirty(same.id);
          g.again = true;
        } else {
          g.raw.saveList({
            id: 'g-' + safeId(x.id), name: x.title || '목록',
            color: mt.color || '#34C759', icon: mt.icon || 'list',
            order: mt.order ?? (1e13 + n), gListId: x.id
          });
        }
      } else if (!l.gDirty) {
        const upd = { ...l }; let ch = false;
        if (x.title && l.name !== x.title) { upd.name = x.title; ch = true; }
        for (const k of ['color', 'icon', 'order']) if (mt[k] != null && upd[k] !== mt[k]) { upd[k] = mt[k]; ch = true; }
        if (ch) g.raw.saveList(upd);
      }
    });
    for (const l of byG.values()) {
      if (live.has(l.gListId) || l.gDirty) continue;
      store.items().filter(i => i.listId === l.id).forEach(i => g.raw.removeItem(i.id));
      g.raw.removeList(l.id);
    }
    // local lists that are not in Google yet: move them there
    for (const u of unlinked) {
      const its = store.items().filter(i => i.listId === u.id);
      if (u.id === 'default' && !its.length && gl.length) { g.raw.removeList(u.id); continue; }
      g.raw.saveList(dirty(u));
      markItemsDirty(u.id);
      g.again = true;
    }
    const byGid = new Map(store.items().filter(i => i.gid).map(i => [i.gid, i]));
    for (const x of gl) {
      const ll = store.lists().find(l => l.gListId === x.id);
      if (!ll) continue;
      const seen = new Set();
      for (const t of x.tasks || []) {
        if (t.deleted || !(t.title || '').trim()) continue;
        seen.add(t.id);
        const loc = byGid.get(t.id);
        if (loc && loc.gDirty) continue;
        const due = t.due ? String(t.due).slice(0, 10) : null;
        const done = t.status === 'completed';
        const doneAt = done ? (Date.parse(t.completed) || Date.now()) : null;
        const rawM = meta['T:' + t.id] || null;
        let tm = null, ord = null;
        if (rawM && rawM.charAt(0) === '{') { const mj = parse(rawM) || {}; tm = mj.t || null; ord = typeof mj.o === 'number' ? mj.o : null; }
        else tm = rawM;
        if (!loc) {
          g.raw.saveItem({
            id: 'g-' + safeId(t.id), title: t.title.trim(), notes: t.notes || '',
            listId: ll.id, due: due || ((done || rawM) ? null : T), time: tm,
            ...(ord != null ? { order: ord } : {}),
            completed: done, completedAt: doneAt,
            createdAt: Date.parse(t.updated) || Date.now(),
            gid: t.id, gList: x.id, gUpdated: t.updated
          });
        } else if (loc.gUpdated !== t.updated || loc.listId !== ll.id) {
          g.raw.saveItem({
            ...loc, title: t.title.trim(), notes: t.notes || '', listId: ll.id,
            due: rawM ? due : (due || loc.due), time: tm, ...(ord != null ? { order: ord } : {}), completed: done,
            completedAt: done ? (loc.completedAt || doneAt) : null,
            gList: x.id, gUpdated: t.updated
          });
        } else if ((loc.time || null) !== tm || (ord != null && loc.order !== ord)) {
          g.raw.saveItem({ ...loc, time: tm, ...(ord != null ? { order: ord } : {}) });
        }
      }
      store.items()
        .filter(i => i.gid && i.gList === x.id && !i.gDirty && !seen.has(i.gid))
        .forEach(i => g.raw.removeItem(i.id));
    }
  }

  async function syncNow() {
    if (!g.enabled || !g.url || !store) return;
    if (g.busy) { g.again = true; return; }
    g.busy = true; g.again = false;
    setStatus('syncing');
    let stop = false;
    try {
      const b = g.v2 ? buildOps() : { ops: [], lmeta: [], imeta: [], nDel: 0, nLDel: 0 };
      const j = await call(b.ops);
      if (j.version !== 2) { stop = true; setStatus('error', '스크립트 업데이트 필요'); return; }
      if (!g.v2) { g.v2 = true; g.again = true; }
      const failed = applyResults(j.results, b);
      applyPull(j.lists || [], j.meta || {});
      g.lastSync = Date.now();
      if (failed) setStatus('error', `${failed}건 반영 실패`); else setStatus('on');
    } catch (e) {
      stop = true;
      setStatus('error', (e && e.msg) || '오류');
    } finally {
      g.busy = false;
      if (g.again && !stop) setTimeout(syncNow, 600);
    }
  }
  function schedulePush() {
    if (!g.enabled) return;
    clearTimeout(g.pushT);
    g.pushT = setTimeout(syncNow, 1200);
  }
  function startTimer() {
    clearInterval(g.timer);
    g.timer = setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
  }

  async function connect(url) {
    url = (url || '').trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast('웹 앱 URL은 https://script.google.com/…/exec 형식이어야 합니다.'); return; }
    g.url = url; LS.set('gbridge.url', url);
    g.enabled = true; LS.set('gbridge.enabled', '1');
    g.v2 = false;
    startTimer();
    await syncNow();
    if (g.status === 'error') toast(`연결하지 못했습니다: ${g.err}`);
    else toast('연결했습니다. 목록과 할 일을 동기화합니다.');
  }
  function disconnect() {
    g.enabled = false; LS.set('gbridge.enabled', null);
    clearInterval(g.timer); g.timer = null; g.lastSync = 0;
    setStatus('off');
  }

  function attach(st) {
    g.raw = { saveItem: st.saveItem, removeItem: st.removeItem, saveList: st.saveList, removeList: st.removeList };
    st.saveItem = it => {
      const prev = st.items().find(i => i.id === it.id);
      const l = listById(it.listId);
      if (g.enabled || (l && l.gListId) || it.gid) { g.raw.saveItem(dirty(it, prev)); schedulePush(); }
      else g.raw.saveItem(it);
    };
    st.removeItem = id => {
      const it = st.items().find(i => i.id === id);
      if (it && it.gid) { deletes.push({ gid: it.gid, gList: it.gList }); saveDeletes(); schedulePush(); }
      g.raw.removeItem(id);
    };
    st.saveList = l => {
      const prev = st.lists().find(x => x.id === l.id);
      if (g.enabled || l.gListId) { g.raw.saveList(dirty(l, prev)); schedulePush(); }
      else g.raw.saveList(l);
    };
    st.removeList = id => {
      const l = st.lists().find(x => x.id === id);
      if (l && l.gListId) { listDeletes.push(l.gListId); saveDeletes(); schedulePush(); }
      g.raw.removeList(id);
    };
    if (g.enabled && g.url) { startTimer(); setTimeout(syncNow, 300); }
    const wake = () => { if (g.enabled && document.visibilityState === 'visible' && Date.now() - g.lastSync > 10000) syncNow(); };
    window.addEventListener('focus', wake);
    document.addEventListener('visibilitychange', wake);
    window.addEventListener('pageshow', wake);
  }

  return {
    attach, connect, disconnect, syncNow, label, warn,
    setKey(k) { k = String(k || '').trim(); if (k && k !== g.key) { g.key = k; LS.set('gbridge.key', k); } },
    get url() { return g.url; }, get key() { return g.key; }, get enabled() { return g.enabled; }
  };
})();

function copyText(text, ta, msg) {
  const done = () => toast(msg || '복사했습니다.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('코드를 직접 선택해 복사해 주세요.'); } });
  } else { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('코드를 직접 선택해 복사해 주세요.'); } }
}

function openGoogleSheet() {
  const code = APPS_SCRIPT.replace('__KEY__', GS.key);
  const html = `
    <div class="sbar"><button class="l" data-s="close">닫기</button><b>Google 할 일</b><span></span></div>
    <div class="grp"><p class="gstat" id="gs-status">${esc(GS.label())}</p></div>
    <div class="ghelp"><b>비밀 키</b> 스크립트와 모든 기기가 같은 키를 써야 합니다. 이미 스크립트를 배포했다면, 다른 기기에서는 처음 설정한 기기의 키를 복사해 이 칸에 붙여넣으세요.</div>
    <div class="grp"><input class="big" name="key" value="${esc(GS.key)}" aria-label="비밀 키" autocomplete="off" spellcheck="false" autocapitalize="off" style="font-family:ui-monospace,Consolas,monospace"><button class="row act" data-s="copykey">키 복사</button></div>
    <div class="ghelp"><b>1단계</b> <code>script.google.com</code>에서 새 프로젝트를 만들고, Code.gs 내용을 아래 코드로 모두 바꿉니다. 위의 비밀 키가 이미 들어 있습니다. (다른 기기를 추가하는 경우라면 1~3단계는 건너뜁니다.)</div>
    <div class="grp"><textarea class="big code" name="code" readonly aria-label="Apps Script 코드" spellcheck="false">${esc(code)}</textarea><button class="row act" data-s="copy">코드 복사</button></div>
    <div class="ghelp">
      <b>2단계</b> 편집기 왼쪽 ‘서비스’ 옆의 +를 눌러 <b>Google Tasks API</b>를 추가합니다.<br>
      <b>3단계</b> 배포 → 새 배포 → 유형 ‘웹 앱’을 고르고, 실행 사용자 ‘나’, 액세스 권한 ‘모든 사용자’로 배포한 뒤 권한을 승인합니다.<br>
      <b>4단계</b> 발급된 웹 앱 URL을 아래에 붙여넣고 연결합니다.
    </div>
    <div class="grp"><input class="big" name="url" value="${esc(GS.url)}" placeholder="https://script.google.com/macros/s/…/exec" aria-label="웹 앱 URL" autocomplete="off" spellcheck="false"></div>
    <div class="grp">
      <button class="row act" data-s="connect">${GS.enabled ? '다시 연결' : '연결하기'}</button>
      <button class="row act" data-s="sync" ${GS.enabled ? '' : 'disabled'}>지금 동기화</button>
      ${GS.enabled ? '<button class="row danger" data-s="disconnect">연결 해제</button>' : ''}
    </div>
    <div class="ghelp">
      Google에서 날짜 없이 추가한 할 일은 ‘오늘’에, 날짜가 있는 할 일은 그 날짜에 표시됩니다. 앱에서 완료·수정·삭제하거나 ‘내일’로 옮기면 Google에도 반영되며, 1분마다 자동으로 동기화합니다.<br>
      연결하면 이 기기의 모든 목록이 Google 할 일로 옮겨져, 같은 키와 URL로 연결한 모든 기기에서 목록·할 일·시간·색상이 동기화됩니다.<br>
      스크립트 코드를 수정했다면 ‘배포 관리’에서 새 버전으로 다시 배포해야 반영됩니다. 연결이 ‘응답 형식 오류’로 실패하면 액세스 권한이 ‘모든 사용자’인지 확인해 주세요.
    </div>`;
  openSheet('Google 할 일 연동', html, e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    const s = overlay.querySelector('.sheet');
    const url = s.querySelector('[name="url"]').value;
    const keyIn = s.querySelector('[name="key"]');
    if (b.dataset.s === 'close') { GS.setKey(keyIn.value); closeSheet(); }
    else if (b.dataset.s === 'copy') copyText(APPS_SCRIPT.replace('__KEY__', keyIn.value.trim() || GS.key), s.querySelector('[name="code"]'), '코드를 복사했습니다.');
    else if (b.dataset.s === 'copykey') copyText(keyIn.value.trim(), keyIn, '비밀 키를 복사했습니다.');
    else if (b.dataset.s === 'connect') { GS.setKey(keyIn.value); closeSheet(); GS.connect(url); }
    else if (b.dataset.s === 'sync') { closeSheet(); GS.syncNow(); }
    else if (b.dataset.s === 'disconnect') { closeSheet(); GS.disconnect(); toast('연결을 해제했습니다. 가져온 항목은 그대로 남습니다.'); }
  }, s => {
    const keyIn = s.querySelector('[name="key"]'), ta = s.querySelector('[name="code"]');
    keyIn.addEventListener('input', () => { ta.value = APPS_SCRIPT.replace('__KEY__', keyIn.value.trim() || GS.key); });
  });
}

/* ---------- boot ---------- */
async function init() {
  let s = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const timeout = ms => new Promise(r => setTimeout(() => r(null), ms));
      const [db, user] = await Promise.all([
        Promise.race([window.claude.use('db'), timeout(8000)]),
        Promise.race([window.claude.use('user'), timeout(8000)])
      ]);
      if (db && user) {
        const uid = await user.id();
        if (uid) s = makeCloudStore(db, uid);
      }
    }
  } catch (e) { s = null; }
  store = s || makeLocalStore();
  GS.attach(store);
  if (window.matchMedia('(min-width: 761px)').matches) S.pane = 'main';
  store.subscribe(render);
  setInterval(() => { if (!S.composing && !document.activeElement.matches('textarea,input')) render(); }, 60000);
}
init();
})();
</script>
